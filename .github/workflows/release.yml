name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -e .
      - run: ruff check skills/wechat-article-downloader/scripts/wechat_article_downloader tests tools
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: skills/wechat-article-downloader/scripts
      - run: python tools/validate_repo.py
      - name: PowerShell CLI wrapper smoke test
        shell: pwsh
        run: |
          $env:WECHAT_DOWNLOADER_HOME = Join-Path $env:RUNNER_TEMP "wechat-downloader-home"
          $env:WECHAT_DOWNLOADER_PYTHON = (Get-Command python).Source
          $unicodeOutput = Join-Path $env:RUNNER_TEMP "微信文章"
          $payload = .\skills\wechat-article-downloader\scripts\wechat-download.ps1 `
            --json config set --formats md,json --output-dir $unicodeOutput | ConvertFrom-Json
          if (
            -not $payload.ok -or
            ($payload.config.default_formats -join ",") -ne "md,json" -or
            $payload.config.output_dir -ne $unicodeOutput
          ) {
            throw "PowerShell argument or UTF-8 normalization failed."
          }
      - name: Package skill and portable archives
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          python .\tools\check_version.py $version
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "Desktop build dependency failed" }
          python .\tools\build_desktop.py $version
          if ($LASTEXITCODE -ne 0) { throw "Desktop build or smoke test failed" }
          .\scripts\package-release.ps1 -Version $version
          python .\tools\verify_release.py $version
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath .\release -File |
              Where-Object { $_.Name -like "*${{ github.ref_name }}.zip" -or $_.Name -eq "SHA256SUMS-${{ github.ref_name }}.txt" } |
              ForEach-Object { $_.FullName }
          )
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" @assets --clobber
          } else {
            gh release create "${{ github.ref_name }}" --generate-notes @assets
          }
